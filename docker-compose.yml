version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quantx-postgres
    environment:
      POSTGRES_DB: quantx
      POSTGRES_USER: quantx
      POSTGRES_PASSWORD: quantx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantx -d quantx"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: quantx-api
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://quantx:quantx@postgres:5432/quantx
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 10s
      retries: 5

  dashboard:
    build: .
    container_name: quantx-dashboard
    env_file:
      - .env
    environment:
      STREAMLIT_HOST: 0.0.0.0
      STREAMLIT_PORT: 8501
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run app/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501').status\""]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
